<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      #id {
        display: flex; 
        flex-direction: column;
      }
      #video-controller {
        margin: 0 0 0 -2px;
        padding: 0;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-af9d7722.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="video-canvas"></canvas>
      <input id="video-controller" type="range" min="0" max="100" value="0" />
      <div style="margin: 8px 0;">
        <input id="video-file" type="file" accept="video/*" />
      </div>
      <div id="video-status" style="margin: 4px 0; font-size: 13px;"></div>
      <div id="video-meta" style="margin: 8px 0; font-size: 13px; opacity: 0.9;"></div>
      <div>
        <button id="video-play">播放🎵</button>
        <button id="video-stop">暂停⏸️</button>
      </div>
      
    </div>
    
  </body>
</html>
