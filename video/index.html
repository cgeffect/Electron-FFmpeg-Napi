<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        font-family: sans-serif;
      }
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }
      #video-controller {
        margin: 0 0 0 -2px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="video-canvas"></canvas>
      <input id="video-controller" type="range" min="0" max="100" value="0" />
      <div style="margin: 8px 0;">
        <input id="video-file" type="file" accept="video/*" />
      </div>
      <div id="video-status" style="margin: 4px 0; font-size: 13px;"></div>
      <div id="video-meta" style="margin: 8px 0; font-size: 13px; opacity: 0.9;"></div>
      <div>
        <button id="video-play">播放🎵</button>
        <button id="video-stop">暂停⏸️</button>
      </div>
      
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
